<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Request a free 30-minute fit call to discuss what you are seeing and whether a TestOpsy is the right next step.">
  <title>Discuss a TestOpsy — The Bad Software Company</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
<script src="/assets/theme.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo"><a href="/index.html" aria-label="The Bad Software Company home"><img class="logo-light" src="/assets/logos/light_background.png" alt="The Bad Software Company"><img class="logo-dark" src="/assets/logos/dark_background.png" alt="The Bad Software Company"></a></h1>
      <nav>
        <a href="/testopsy.html">TestOpsy</a>
        <a href="/advisory.html">Advisory</a>
        <a href="/implementation.html">Implementation</a>
        <a href="/case-studies/index.html">Case Studies</a>
        <a href="/blog/index.html">Insights</a>
        <a href="/about.html">About</a>
        <a class="nav-cta" href="/contact.html">Discuss a TestOpsy</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page-hero compact">
      <p class="eyebrow">Start a conversation</p>
      <h2>Discuss a TestOpsy</h2>
      <p>Request a free 30-minute fit call. We'll discuss what you're seeing, whether a TestOpsy is appropriate, and the best next step.</p>
    </section>
    <form id="contact-form" action="mailto:hello@badsoftware.com?subject=TestOpsy%20fit%20call" method="post" enctype="text/plain">
      <p class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </p>

      <p class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </p>

      <p class="field">
        <label for="message">What are you seeing?</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </p>

      <p><button type="submit" class="cta">Request a fit call</button></p>
    </form>
  </main>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const name = form.elements.name.value.trim();
      const email = form.elements.email.value.trim();
      const message = form.elements.message.value.trim();
      const subject = name ? `TestOpsy fit call request from ${name}` : 'TestOpsy fit call request';
      const body = [
        `Name: ${name}`,
        `Email: ${email}`,
        '',
        'What I am seeing:',
        message
      ].join('\n');

      window.location.href = `mailto:hello@badsoftware.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    });
  </script>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 The Bad Software Company</p>
    </div>
  </footer>
</body>
</html>
